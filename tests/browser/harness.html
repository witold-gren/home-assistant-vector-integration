<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>vector-control-card harness</title>
<style>html,body{margin:0;height:100%;background:#1c2330;font-family:sans-serif}</style>
</head>
<body>
<!-- Dashboards wrap cards in transformed containers: position:fixed inside them is relative to
     the tile, which is why the full-screen view must be a portal in <body>. -->
<div id="wrap" style="transform:translateZ(0);padding:12px;width:380px"><div id="slot"></div></div>
<script>
  const params = new URLSearchParams(location.search);
  const offline = params.get("offline") === "1";
  const stream = params.get("stream") !== "0";
  const program = params.get("program") === "1"; // a child's program runs (add-on 0.3.0+)
  const still = params.get("still"); // stand still switch (add-on 0.5.0+): "on" | "off" | missing

  // The card registers itself once <home-assistant> exists (like in the real frontend).
  customElements.define("home-assistant", class extends HTMLElement {});

  // Fake HA camera player: records how the card created it; contains a <video> like the real one.
  window.streams = 0;
  customElements.define("ha-camera-stream", class extends HTMLElement {
    connectedCallback() {
      if (!this.shadowRoot) this.attachShadow({ mode: "open" }).innerHTML = "<video muted></video>";
      window.streams += 1;
    }
  });
  window.loadCardHelpers = async () => ({ createCardElement: () => document.createElement("div") });

  // Fake microphone: getUserMedia resolves only when the test says so (permission prompt).
  window.micGrants = [];
  window.recorders = 0;
  window.stoppedTracks = 0;
  window.fetches = [];
  Object.defineProperty(window, "isSecureContext", { value: true });
  navigator.mediaDevices.getUserMedia = () => new Promise((resolve) => {
    window.micGrants.push(() => resolve({ getTracks: () => [{ stop: () => { window.stoppedTracks += 1; } }] }));
  });
  window.MediaRecorder = class {
    constructor() { window.recorders += 1; this.mimeType = "audio/mp4"; }
    start() {}
    stop() {
      if (this.ondataavailable) this.ondataavailable({ data: new Blob([new Uint8Array(4000)]) });
      if (this.onstop) this.onstop();
    }
  };

  const DEV = "dev-vector";
  const reg = (id, key) => ({ entity_id: id, device_id: DEV, platform: "vector", translation_key: key });
  const st = (id, state, attributes = {}) => ({ entity_id: id, state, attributes });
  const unavailable = (id, attributes = {}) => st(id, "unavailable", attributes);
  window.calls = [];
  window.hass = {
    language: "pl",
    entities: {
      "camera.vector": reg("camera.vector", "camera"),
      "sensor.vector_battery": reg("sensor.vector_battery", null),
      "sensor.vector_activity": reg("sensor.vector_activity", "activity"),
      "binary_sensor.vector_on_charger": reg("binary_sensor.vector_on_charger", "on_charger"),
      "switch.vector_manual_control": reg("switch.vector_manual_control", "hold_control"),
      "button.vector_drive_off_charger": reg("button.vector_drive_off_charger", "drive_off_charger"),
      "button.vector_go_to_charger": reg("button.vector_go_to_charger", "drive_on_charger"),
      "button.vector_refresh_camera_image": reg("button.vector_refresh_camera_image", "refresh_camera"),
      "image.vector_last_frame": reg("image.vector_last_frame", "last_frame"),
      "binary_sensor.vector_program": reg("binary_sensor.vector_program", "program"),
      ...(still ? { "switch.vector_stand_still": reg("switch.vector_stand_still", "stand_still") } : {}),
    },
    states: offline
      ? {
          "camera.vector": unavailable("camera.vector", { supported_features: stream ? 2 : 0 }),
          "image.vector_last_frame": st("image.vector_last_frame", "x", { entity_picture: "/last-frame.jpg?token=t" }),
          "sensor.vector_battery": unavailable("sensor.vector_battery", { device_class: "battery" }),
          "sensor.vector_activity": unavailable("sensor.vector_activity"),
          "binary_sensor.vector_on_charger": unavailable("binary_sensor.vector_on_charger"),
          "switch.vector_manual_control": unavailable("switch.vector_manual_control"),
        }
      : {
          "camera.vector": st("camera.vector", "idle", { access_token: "tok1", supported_features: stream ? 2 : 0 }),
          "image.vector_last_frame": st("image.vector_last_frame", "x", { entity_picture: "/last-frame.jpg?token=t" }),
          "sensor.vector_battery": st("sensor.vector_battery", "87", { device_class: "battery" }),
          "sensor.vector_activity": st("sensor.vector_activity", "Exploring"),
          "binary_sensor.vector_on_charger": st("binary_sensor.vector_on_charger", "off"),
          "switch.vector_manual_control": st("switch.vector_manual_control", "off"),
          "button.vector_drive_off_charger": st("button.vector_drive_off_charger", "unknown"),
          "button.vector_go_to_charger": st("button.vector_go_to_charger", "unknown"),
          "button.vector_refresh_camera_image": st("button.vector_refresh_camera_image", "unknown"),
          "binary_sensor.vector_program": st("binary_sensor.vector_program", program ? "on" : "off",
            program ? { owner: "rcs", since: "2026-11-23T10:00:00+00:00", limit: 300 } : {}),
          ...(still ? { "switch.vector_stand_still": st("switch.vector_stand_still", still) } : {}),
        },
    fetchWithAuth(url, opts) {
      window.fetches.push({ url, type: opts && opts.headers && opts.headers["Content-Type"] });
      return Promise.resolve({ ok: true, json: async () => ({ message: "ok" }) });
    },
    callService(domain, service, data) {
      window.calls.push({ domain, service, data, t: performance.now() });
      return Promise.resolve();
    },
  };
</script>
<script src="/custom_components/vector/www/vector-control-card.js"></script>
<script>
  customElements.whenDefined("vector-control-card").then(() => {
    window.card = document.createElement("vector-control-card");
    card.setConfig({ type: "custom:vector-control-card", camera: "camera.vector" });
    document.getElementById("slot").appendChild(card);
    card.hass = window.hass;
    window.cardReady = true;
  });
</script>
</body>
</html>
