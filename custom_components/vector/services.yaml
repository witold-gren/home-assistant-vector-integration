say_text:
  fields:
    device_id: &robot
      selector:
        device:
          integration: vector
    text:
      required: true
      example: "Hello!"
      selector:
        text:
    engine:
      default: default
      selector:
        select:
          translation_key: engine
          options:
            - default
            - wirepod
            - tts
            - vector
play_animation:
  fields:
    device_id: *robot
    name:
      required: true
      example: anim_pounce_success_02
      selector:
        text:
    loops: &loops
      default: 1
      selector:
        number:
          min: 1
          max: 10
play_animation_trigger:
  fields:
    device_id: *robot
    name:
      required: true
      example: GreetAfterLongTime
      selector:
        text:
    loops: *loops
list_animations:
  fields:
    device_id: *robot
    triggers:
      default: false
      selector:
        boolean:
run_intent:
  fields:
    device_id: *robot
    intent:
      required: true
      example: intent_imperative_dance
      selector:
        select:
          custom_value: true
          options:
            - intent_imperative_dance
            - intent_explore_start
            - intent_system_sleep
            - intent_system_charger
            - intent_imperative_come
            - intent_imperative_lookatme
            - intent_play_fistbump
            - intent_play_anytrick
            - intent_photo_take_extend
            - intent_greeting_hello
            - intent_greeting_goodmorning
            - intent_greeting_goodnight
            - intent_clock_time
            - intent_weather_extend
            - intent_imperative_praise
            - intent_imperative_love
            - intent_play_blackjack
            - intent_play_rollcube
            - intent_play_popawheelie
            - intent_play_keepaway
    param:
      selector:
        text:
drive_straight:
  fields:
    device_id: *robot
    distance:
      required: true
      selector:
        number:
          min: -1000
          max: 1000
          unit_of_measurement: mm
    speed:
      default: 100
      selector:
        number:
          min: 10
          max: 200
          unit_of_measurement: mm/s
turn:
  fields:
    device_id: *robot
    angle:
      required: true
      selector:
        number:
          min: -360
          max: 360
          unit_of_measurement: "°"
    speed:
      default: 90
      selector:
        number:
          min: 10
          max: 360
          unit_of_measurement: "°/s"
drive_wheels:
  fields:
    device_id: *robot
    left:
      required: true
      selector:
        number:
          min: -220
          max: 220
          unit_of_measurement: mm/s
    right:
      required: true
      selector:
        number:
          min: -220
          max: 220
          unit_of_measurement: mm/s
    duration:
      default: 1
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s
set_eye_color:
  fields:
    device_id: *robot
    hue:
      required: true
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: "°"
    saturation:
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
stop:
  fields:
    device_id: *robot
move:
  fields:
    device_id: *robot
    left: &wheel
      default: 0
      selector:
        number:
          min: -220
          max: 220
          unit_of_measurement: mm/s
    right: *wheel
    head: &motor
      default: 0
      selector:
        number:
          min: -2
          max: 2
          step: 0.1
          unit_of_measurement: rad/s
    lift: *motor
list_photos:
  fields:
    device_id: *robot
delete_photo:
  fields:
    device_id: *robot
    photo_id:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
list_faces:
  fields:
    device_id: *robot
rename_face:
  fields:
    device_id: *robot
    face_id: &face
      required: true
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    name:
      required: true
      selector:
        text:
delete_face:
  fields:
    device_id: *robot
    face_id: *face
enroll_face:
  fields:
    device_id: *robot
    name:
      required: true
      selector:
        text:
go_to:
  fields:
    device_id: *robot
    x: &mm
      default: 0
      selector:
        number:
          min: -2000
          max: 2000
          unit_of_measurement: mm
    y: *mm
    angle:
      default: 0
      selector:
        number:
          min: -360
          max: 360
          unit_of_measurement: "°"
    relative:
      default: true
      selector:
        boolean:
turn_towards_face:
  fields:
    device_id: *robot
    face_id:
      default: -1
      selector:
        number:
          min: -1
          max: 100000
          mode: box
go_to_cube:
  fields:
    device_id: *robot
    distance:
      default: 70
      selector:
        number:
          min: 40
          max: 500
          unit_of_measurement: mm
